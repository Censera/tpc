name: tpc
version: 0.2.0
main: com.censera.tpc.TpcPlugin
api-version: "26.2"
author: Censera
description: Small teleportation utility for Paper 26.2.

commands:
  tpc:
    description: Open the teleportation menu.
    usage: /tpc [ask|here|accept|decline|bed|home]
    permission: tpc.command

  tpr:
    description: Reload tpc configuration.
    usage: /tpr
    permission: tpc.reload

  tpa:
    description: Request to teleport to a player.
    usage: /tpa [player|cancel|page <number>]
    permission: tpc.request

  tph:
    description: Ask a player to teleport to you.
    usage: /tph [player|cancel|page <number>]
    permission: tpc.here

  accept:
    description: Accept a teleport request.
    usage: /accept
    permission: tpc.accept

  decline:
    description: Decline a teleport request.
    usage: /decline
    permission: tpc.decline

  back:
    description: Teleport back to the previous location.
    usage: /back
    permission: tpc.back

  bed:
    description: Teleport to your bed.
    usage: /bed
    permission: tpc.bed

  home:
    description: Manage and teleport to homes.
    usage: /home [name|list|set <name> [is-primary]|delete <name>|primary <name>]
    permission: tpc.home

  spawn:
    description: Teleport to server spawn.
    usage: /spawn
    permission: tpc.spawn

  tpaccept:
    description: Alias for /accept.
    usage: /tpaccept
    permission: tpc.accept
    aliases: [tpaaccept]

  tpdecline:
    description: Alias for /decline.
    usage: /tpdecline
    permission: tpc.decline

  tpback:
    description: Alias for /back.
    usage: /tpback
    permission: tpc.back

  tpbed:
    description: Alias for /bed.
    usage: /tpbed
    permission: tpc.bed

  tphome:
    description: Alias for /home.
    usage: /tphome
    permission: tpc.home

permissions:
  tpc.command:
    default: true
  tpc.reload:
    default: op
  tpc.request:
    default: true
  tpc.here:
    default: true
  tpc.accept:
    default: true
  tpc.decline:
    default: true
  tpc.back:
    default: true
  tpc.bed:
    default: true
  tpc.home:
    default: true
  tpc.spawn:
    default: true
